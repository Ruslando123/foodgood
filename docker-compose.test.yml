services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: foodgood
      POSTGRES_PASSWORD: foodgood
      POSTGRES_DB: foodgood_test
    ports:
      - "55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U foodgood -d foodgood_test"]
      interval: 1s
      timeout: 5s
      retries: 30
