[databases]
foodgood_staging = host=postgres port=5432 dbname=foodgood_staging

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /run/pgbouncer
pidfile = /run/pgbouncer/pgbouncer.pid
auth_type = scram-sha-256
auth_file = /run/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
min_pool_size = 4
reserve_pool_size = 5
reserve_pool_timeout = 3
server_connect_timeout = 5
server_login_retry = 2
server_idle_timeout = 60
server_lifetime = 3600
query_timeout = 30
query_wait_timeout = 15
client_idle_timeout = 300
ignore_startup_parameters = extra_float_digits
admin_users = foodgood_staging
stats_users = foodgood_staging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

