resolver 127.0.0.11 valid=10s ipv6=off;

upstream foodgood_web {
    zone foodgood_web 64k;
    least_conn;
    server web-1:3000 resolve max_fails=2 fail_timeout=10s;
    server web-2:3000 resolve max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 6m;

    location / {
        proxy_pass http://foodgood_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-FoodGood-Upstream $upstream_addr always;
    }
}
