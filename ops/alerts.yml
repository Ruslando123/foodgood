groups:
  - name: foodgood
    rules:
      - alert: FoodGoodHighP99
        expr: histogram_quantile(0.99, sum by (le, route, method) (rate(foodgood_http_request_duration_seconds_bucket[5m]))) > 1.2
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "FoodGood API p99 is above 1.2s" }
      - alert: FoodGoodQueueLag
        expr: foodgood_queue_lag_seconds > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "FoodGood queue is more than two minutes behind" }
      - alert: FoodGoodExpiredLease
        expr: foodgood_queue_expired_leases > 0
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "A queue has a PROCESSING item with an expired lease" }
      - alert: FoodGoodQueueDepthNotDraining
        expr: foodgood_queue_depth > 0 and delta(foodgood_queue_depth[5m]) >= 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "Queue depth has not decreased for five minutes" }
      - alert: FoodGoodWorkerHeartbeatStale
        expr: time() - foodgood_worker_last_heartbeat_seconds > 30
        for: 2m
        labels: { severity: critical }
        annotations: { summary: "A worker heartbeat is stale" }
      - alert: FoodGoodWorkerLeaseLoss
        expr: increase(foodgood_worker_lease_lost_total[10m]) > 0
        labels: { severity: warning }
        annotations: { summary: "A worker lost ownership while processing an item" }
      - alert: FoodGoodWorkerFailures
        expr: increase(foodgood_worker_failure_total[10m]) > 5
        labels: { severity: warning }
        annotations: { summary: "Worker retry/failure volume is elevated" }
      - alert: FoodGoodPoolSaturation
        expr: foodgood_db_pool_connections / foodgood_db_max_connections > 0.8
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "PostgreSQL connection budget is above 80%" }
      - alert: FoodGoodPaymentFailures
        expr: foodgood_payment_failures_recent > 5
        labels: { severity: critical }
        annotations: { summary: "Payment operations are failing" }
      - alert: FoodGoodRedisFallback
        expr: increase(foodgood_rate_limit_fallback_total[5m]) > 0
        labels: { severity: critical }
        annotations: { summary: "Redis rate limiting is falling back to PostgreSQL" }
      - alert: FoodGoodPendingPaymentStale
        expr: foodgood_order_status_oldest_age_seconds{status="PENDING_PAYMENT"} > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "PENDING_PAYMENT orders exceed the allowed age" }
      - alert: FoodGoodCapturePendingStale
        expr: foodgood_order_status_oldest_age_seconds{status="CAPTURE_PENDING"} > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "CAPTURE_PENDING orders exceed the allowed age" }
      - alert: FoodGoodRefundPendingStale
        expr: foodgood_order_status_oldest_age_seconds{status="REFUND_PENDING"} > 120
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "REFUND_PENDING orders exceed the allowed age" }
