name: foodgood-local-staging

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: "postgresql://foodgood_staging:${STAGING_POSTGRES_PASSWORD:?run node ops/staging/create-env.mjs}@pgbouncer:6432/foodgood_staging?schema=public"
  DIRECT_URL: "postgresql://foodgood_staging:${STAGING_POSTGRES_PASSWORD:?run node ops/staging/create-env.mjs}@postgres:5432/foodgood_staging?schema=public"
  DATABASE_CONNECTION_LIMIT: "5"
  DATABASE_POOL_TIMEOUT: "10"
  DATABASE_PGBOUNCER: "true"
  REDIS_URL: "redis://redis:6379/0"
  REDIS_REQUIRED: "true"
  SESSION_SECRET: "${STAGING_SESSION_SECRET:?run node ops/staging/create-env.mjs}"
  OTP_SECRET: "${STAGING_OTP_SECRET:?run node ops/staging/create-env.mjs}"
  METRICS_SECRET: "${STAGING_METRICS_SECRET:?run node ops/staging/create-env.mjs}"
  APP_BASE_URL: "http://localhost:${STAGING_PORT:-3000}"
  # The demo OTP is enabled only by the triple guard in src/lib/auth.ts:
  # explicit demo flag, local-rehearsal marker, and a localhost app URL.
  FOODGOOD_E2E_DEV_OTP: "true"
  FOODGOOD_LOCAL_REHEARSAL: "true"
  FOODGOOD_DISABLE_DEV_OTP: "false"
  TELEGRAM_AUTH_ENABLED: "false"
  TELEGRAM_NOTIFICATIONS_ENABLED: "false"
  TELEGRAM_OTP_ENABLED: "false"

x-web: &web
  image: foodgood-local-staging:latest
  build:
    context: .
    dockerfile: Dockerfile.staging
    target: runtime
  restart: unless-stopped
  init: true
  environment: *app-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
    pgbouncer:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s
  networks:
    - frontend
    - backend
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /app/.next/cache:size=64m,mode=0755,uid=1000,gid=1000
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodgood_staging
      POSTGRES_PASSWORD: "${STAGING_POSTGRES_PASSWORD:?run node ops/staging/create-env.mjs}"
      POSTGRES_DB: foodgood_staging
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U foodgood_staging -d foodgood_staging"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  pgbouncer:
    build:
      context: ops/staging/pgbouncer
    image: foodgood-local-pgbouncer:1.0
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "${STAGING_POSTGRES_PASSWORD:?run node ops/staging/create-env.mjs}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-p", "6432", "-U", "foodgood_staging", "-d", "foodgood_staging"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /run/pgbouncer:size=8m,mode=0750
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - backend
    read_only: true
    tmpfs:
      - /data:size=16m,mode=0700
    security_opt:
      - no-new-privileges:true

  migrate:
    image: foodgood-local-staging:latest
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: runtime
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://foodgood_staging:${STAGING_POSTGRES_PASSWORD:?run node ops/staging/create-env.mjs}@postgres:5432/foodgood_staging?schema=public"
    command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true

  worker-expiry:
    image: foodgood-local-staging-tooling:latest
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: tooling
    restart: unless-stopped
    init: true
    user: node
    environment:
      <<: *app-environment
      DATABASE_CONNECTION_LIMIT: "2"
      WORKER_METRICS_PORT: "9100"
    command: ["./node_modules/.bin/tsx", "scripts/worker.ts", "expiry"]
    expose:
      - "9100"
    ports:
      - "127.0.0.1:${STAGING_EXPIRY_METRICS_PORT:-9101}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  worker-notifications:
    image: foodgood-local-staging-tooling:latest
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: tooling
    restart: unless-stopped
    init: true
    user: node
    environment:
      <<: *app-environment
      DATABASE_CONNECTION_LIMIT: "2"
      WORKER_METRICS_PORT: "9100"
    command: ["./node_modules/.bin/tsx", "scripts/worker.ts", "notifications"]
    expose:
      - "9100"
    ports:
      - "127.0.0.1:${STAGING_NOTIFICATIONS_METRICS_PORT:-9102}:9100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  web-1:
    <<: *web
    ports:
      - "127.0.0.1:${STAGING_WEB_1_PORT:-3001}:3000"

  web-2:
    <<: *web
    ports:
      - "127.0.0.1:${STAGING_WEB_2_PORT:-3002}:3000"

  load-seed:
    profiles: ["load"]
    image: foodgood-local-staging-tooling:latest
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: tooling
    user: "${STAGING_HOST_UID:-1000}:${STAGING_HOST_GID:-1000}"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://foodgood_staging:${STAGING_POSTGRES_PASSWORD:?run node ops/staging/create-env.mjs}@postgres:5432/foodgood_staging?schema=public"
      DATABASE_CONNECTION_LIMIT: "5"
      SESSION_SECRET: "${STAGING_SESSION_SECRET:?run node ops/staging/create-env.mjs}"
      LOAD_SEED_CONFIRM: "${LOAD_SEED_CONFIRM:-}"
      LOAD_FIXTURE_FILE: /app/load/fixtures.local.json
      LOAD_VENUES: "${LOAD_VENUES:-100}"
      LOAD_BAGS_PER_VENUE: "${LOAD_BAGS_PER_VENUE:-50}"
      LOAD_CUSTOMERS: "${LOAD_CUSTOMERS:-200}"
      LOAD_RESERVATION_BAGS: "${LOAD_RESERVATION_BAGS:-20}"
      LOAD_MERCHANTS: "${LOAD_MERCHANTS:-50}"
      LOAD_REDEEM_ORDERS_PER_MERCHANT: "${LOAD_REDEEM_ORDERS_PER_MERCHANT:-10}"
      LOAD_EXPIRY_ORDERS: "${LOAD_EXPIRY_ORDERS:-0}"
      LOAD_EXPIRY_DELAY_SECONDS: "${LOAD_EXPIRY_DELAY_SECONDS:-90}"
    command: ["./node_modules/.bin/tsx", "scripts/seed-load.ts"]
    volumes:
      - ./load:/app/load
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  load-check:
    profiles: ["load"]
    image: foodgood-local-staging-tooling:latest
    build:
      context: .
      dockerfile: Dockerfile.staging
      target: tooling
    user: "${STAGING_HOST_UID:-1000}:${STAGING_HOST_GID:-1000}"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://foodgood_staging:${STAGING_POSTGRES_PASSWORD:?run node ops/staging/create-env.mjs}@postgres:5432/foodgood_staging?schema=public"
      DATABASE_CONNECTION_LIMIT: "5"
      LOAD_PROFILE: "${LOAD_PROFILE:-normal}"
      LOAD_FIXTURE_FILE: /app/load/fixtures.local.json
    command: ["./node_modules/.bin/tsx", "scripts/check-load-invariants.ts"]
    volumes:
      - ./load:/app/load
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGING_PORT:-3000}:8080"
    volumes:
      - ./ops/staging/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web-1:
        condition: service_healthy
      web-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - frontend
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=0755
      - /var/run:size=1m,mode=0755
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:

networks:
  frontend:
  backend:
    internal: true
