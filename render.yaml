services:
  - type: web
    name: foodgood-web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: DATABASE_URL=$DIRECT_URL npx prisma migrate deploy && npm run jobs:backfill-reminders
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionString
      - key: DIRECT_URL
        sync: false
      - key: DATABASE_CONNECTION_LIMIT
        value: "5"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        sync: false
      - key: MOBIZON_API_KEY
        sync: false
      - key: MOBIZON_SENDER
        sync: false
      - key: TELEGRAM_AUTH_ENABLED
        value: "false"
      - key: TELEGRAM_NOTIFICATIONS_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOW_MOCK_PAYMENTS_IN_PRODUCTION
        value: "false"
      - key: FREEDOMPAY_MERCHANT_ID
        sync: false
      - key: FREEDOMPAY_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: METRICS_SECRET
        sync: false
      - key: LOAD_TEST_MODE
        value: "false"

  - type: worker
    name: foodgood-payments-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:payments
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionString
      - key: DATABASE_CONNECTION_LIMIT
        value: "4"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: REDIS_URL
        sync: false
      - key: WORKER_METRICS_PORT
        value: "9100"
      - key: METRICS_SECRET
        sync: false
      - key: ALLOW_MOCK_PAYMENTS_IN_PRODUCTION
        value: "false"
      - key: LOAD_TEST_MODE
        value: "false"
      - key: FREEDOMPAY_MERCHANT_ID
        sync: false
      - key: FREEDOMPAY_SECRET_KEY
        sync: false

  - type: worker
    name: foodgood-expiry-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:expiry
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionString
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: WORKER_METRICS_PORT
        value: "9100"
      - key: METRICS_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: foodgood-notifications-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:notifications
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionString
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_PGBOUNCER
        value: "true"

      - key: WORKER_METRICS_PORT
        value: "9100"
      - key: METRICS_SECRET
        sync: false

  - type: worker
    name: foodgood-outbox-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:outbox
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionString
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: TELEGRAM_NOTIFICATIONS_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WORKER_METRICS_PORT
        value: "9100"
      - key: METRICS_SECRET
        sync: false

databases:
  - name: foodgood-db
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 15
    postgresMajorVersion: "16"
    databaseName: foodgood
    user: foodgood
    connectionPool: pgbouncer
