services:
  - type: keyvalue
    name: foodgood-redis
    region: frankfurt
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: foodgood-web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: DATABASE_URL=$DIRECT_URL npx prisma migrate deploy && npm run jobs:backfill-reminders
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionPoolString
      - key: DIRECT_URL
        fromDatabase:
          name: foodgood-db
          property: connectionString
      - key: DATABASE_CONNECTION_LIMIT
        value: "5"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: foodgood-redis
          property: connectionString
      - key: SESSION_SECRET
        sync: false
      - key: OTP_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: MOBIZON_API_KEY
        sync: false
      - key: MOBIZON_SENDER
        sync: false
      - key: TELEGRAM_AUTH_ENABLED
        value: "false"
      - key: TELEGRAM_NOTIFICATIONS_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOW_MOCK_PAYMENTS_IN_PRODUCTION
        value: "false"
      - key: FREEDOM_PAY_MERCHANT_ID
        sync: false
      - key: FREEDOM_PAY_SECRET_KEY
        sync: false
      - key: FREEDOM_PAY_TEST_MODE
        value: "false"
      # Render does not provision S3 buckets/CDNs. Supply least-privilege
      # credentials for an external S3-compatible bucket and CDN hostname.
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: METRICS_SECRET
        sync: false
      - key: LOAD_TEST_MODE
        value: "false"

  - type: worker
    name: foodgood-payments-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:payments
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionPoolString
      - key: DATABASE_CONNECTION_LIMIT
        value: "4"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: foodgood-redis
          property: connectionString
      - key: ALLOW_MOCK_PAYMENTS_IN_PRODUCTION
        value: "false"
      - key: LOAD_TEST_MODE
        value: "false"
      - key: FREEDOM_PAY_MERCHANT_ID
        sync: false
      - key: FREEDOM_PAY_SECRET_KEY
        sync: false
      - key: FREEDOM_PAY_TEST_MODE
        value: "false"
      - key: APP_BASE_URL
        sync: false

  - type: worker
    name: foodgood-expiry-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:expiry
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionPoolString
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: foodgood-redis
          property: connectionString

  - type: worker
    name: foodgood-notifications-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:notifications
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionPoolString
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_PGBOUNCER
        value: "true"


  - type: worker
    name: foodgood-outbox-worker
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run db:generate
    startCommand: npm run worker:outbox
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 90
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: foodgood-db
          property: connectionPoolString
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_PGBOUNCER
        value: "true"
      - key: TELEGRAM_NOTIFICATIONS_ENABLED
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false

databases:
  - name: foodgood-db
    region: frankfurt
    plan: basic-256mb
    diskSizeGB: 15
    postgresMajorVersion: "16"
    databaseName: foodgood
    user: foodgood
    connectionPool: pgbouncer
